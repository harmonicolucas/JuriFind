services:
  - type: web
    name: jurifind
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENRICH_CONTACTS
        value: "true"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: ALLOWED_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
